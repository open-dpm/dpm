version: "1.0"

business_terms:
  - name: "wallet payment"
    definition: "A payment settled from a customer's in-app wallet balance"
    aliases:
      - "wallet transaction"
    owner: "payments"

interpretation:
  grain: "one row per wallet payment"
  time_basis: "created_at"
  lifecycle:
    description: "A row is created for each wallet settlement attempt"
    terminal_states:
      - "captured"
      - "failed"
      - "refunded"

typical_questions:
  - "What share of payments is settled via wallet?"
  - "What is the wallet payment success rate?"

ai_hints:
  default_time_field: "created_at"
  default_grain: "day"
  recommended_visualizations:
    - "line_chart"
    - "table"
  safe_aggregation_notes:
    - "Sum amount only within a single currency and status"
