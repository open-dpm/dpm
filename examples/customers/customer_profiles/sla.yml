# ═══════════════════════════════════════════════════════════════════════════
# SLA: customers/customer_profiles
# ═══════════════════════════════════════════════════════════════════════════
availability:
  target: "99.5%"

freshness:
  max_age: "PT1H"
  timestamp_field: "created_at"
  alert_threshold: "PT30M"

retention:
  prod:
    duration: "P3Y"
    reason: "Master data — retained for the customer relationship lifetime"
  dlq:
    duration: "P30D"
    reason: "For investigating quality issues"

quality:
  max_dlq_rate_percent: 1.0
  alert_dlq_rate_percent: 0.5

escalation:
  level_1:
    team: "customer-data"
    mattermost: "customer-data"
    email: "customer-data@example.com"
