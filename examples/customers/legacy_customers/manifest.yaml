# ═══════════════════════════════════════════════════════════════════════════
# DATA PRODUCT: customers/legacy_customers
# ═══════════════════════════════════════════════════════════════════════════
# Still pinned to customer@1, which is deprecated — the conformance check emits
# a warning until this product migrates to customer@2 (add `country`).

spec_version: "1.0.0"
manifest_version: "1.2.0"
status: "active"  # draft | active | deprecated | retired

metadata:
  name: "legacy_customers"
  namespace: "customers"
  data_category: "master_data"
  pii: true
  display_name: "Legacy Customers"
  description: |
    Customer records imported from the old monolith. Still conforms to the
    previous customer major (customer@1) and has not yet added the residence
    country required by customer@2.

  owner:
    team: "customer-data"
    email: "customer-data@example.com"
    mattermost: "customer-data"

  tags:
    - "customers"
    - "legacy"

  conforms_to:
    - entity: "customer@1"

  created_at: "2026-02-01"
  updated_at: "2026-06-05"
  created_by: "customer-data@example.com"

schema:
  file: "./schema.avsc"
  format: "avro"

semantics:
  file: "./semantics.yml"

quality_rules:
  file: "./quality_rules.yml"
  enabled: true

sla:
  file: "./sla.yml"

lineage:
  upstream:
    - system: "Legacy monolith"
      api: "jdbc:postgresql://legacy-db/customers"
      extraction_method: batch
  downstream: []

changelog:
  - version: "1.2.0"
    date: "2026-06-05"
    author: "customer-data@example.com"
    changes:
      - type: "improvement"
        description: "Tighten email quality rule"
    breaking: false
  - version: "1.0.0"
    date: "2026-02-01"
    author: "customer-data@example.com"
    changes:
      - type: "initial"
        description: "First import of legacy customers"
    breaking: false
