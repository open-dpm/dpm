version: "1.0"

rules:
  - name: "customer_id_not_null"
    field: "customer_id"
    type: "not_null"
    severity: "error"
    message: "Customer id is required"

  - name: "email_format"
    field: "email"
    type: "format"
    format_type: "email"
    severity: "warning"
    message: "Email should be a valid email address"

  - name: "created_at_not_null"
    field: "created_at"
    type: "not_null"
    severity: "error"
    message: "Creation time is required"
