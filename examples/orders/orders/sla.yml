availability:
  target: "99.9%"

freshness:
  max_age: "PT5M"
  timestamp_field: "placed_at"
  alert_threshold: "PT2M"

retention:
  prod:
    duration: "P7Y"
    reason: "Financial records — statutory retention"
  dlq:
    duration: "P30D"
    reason: "For investigating quality issues"

quality:
  max_dlq_rate_percent: 0.5
  alert_dlq_rate_percent: 0.2

escalation:
  level_1:
    team: "orders-platform"
    mattermost: "orders-platform"
    email: "orders-platform@example.com"
