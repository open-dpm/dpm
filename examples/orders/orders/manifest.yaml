# ═══════════════════════════════════════════════════════════════════════════
# DATA PRODUCT: orders/orders
# ═══════════════════════════════════════════════════════════════════════════

spec_version: "1.0.0"
manifest_version: "1.0.0"
status: "active"  # draft | active | deprecated | retired

metadata:
  name: "orders"
  namespace: "orders"
  data_category: "transactional_data"
  pii: false
  display_name: "Orders"
  description: |
    Orders placed by customers in the online store: one row per order at the
    moment it is placed, with its total and currency.

  owner:
    team: "orders-platform"
    email: "orders-platform@example.com"
    mattermost: "orders-platform"

  tags:
    - "orders"
    - "transactional"

  # Its rows ARE orders. The canonical attribute `created_at` is carried by the
  # physical field `placed_at`.
  conforms_to:
    - entity: "order@1"
      rename:
        created_at: "placed_at"

  created_at: "2026-03-01"
  updated_at: "2026-03-01"
  created_by: "orders-platform@example.com"

schema:
  file: "./schema.avsc"
  format: "avro"

semantics:
  file: "./semantics.yml"

quality_rules:
  file: "./quality_rules.yml"
  enabled: true

sla:
  file: "./sla.yml"

lineage:
  upstream:
    - system: "Shop backend"
      api: "https://shop.example.com/internal/orders"
      extraction_method: cdc
  downstream: []

changelog:
  - version: "1.0.0"
    date: "2026-03-01"
    author: "orders-platform@example.com"
    changes:
      - type: "initial"
        description: "First version of the orders product"
    breaking: false
