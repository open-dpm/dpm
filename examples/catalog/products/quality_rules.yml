version: "1.0"

rules:
  - name: "product_id_not_null"
    field: "product_id"
    type: "not_null"
    severity: "error"
    message: "Product id is required"

  - name: "sku_unique"
    field: "sku"
    type: "unique"
    severity: "error"
    message: "SKU must be unique"

  - name: "name_not_null"
    field: "name"
    type: "not_null"
    severity: "error"
    message: "Product name is required"

  - name: "price_range"
    field: "price"
    type: "range"
    min: 0
    severity: "error"
    message: "Price must be non-negative"

  - name: "currency_format"
    field: "currency"
    type: "regex"
    pattern: "^[A-Z]{3}$"
    severity: "error"
    message: "Currency must be an ISO 4217 code"
